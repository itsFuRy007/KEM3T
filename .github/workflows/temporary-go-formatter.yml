name: Temporary Go Formatter

on:
  push:
    branches:
      - fix/tcp-evidence-and-cli-state

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/tcp-evidence-and-cli-state
      - name: Format changed Go files
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD -- '*.go')"
          if [ -z "$changed" ]; then
            echo "No changed Go files."
            exit 0
          fi
          printf '%s\n' "$changed" | xargs -r gofmt -w
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $changed
            git commit -m "chore: format TCP state integration"
            git push origin HEAD:fix/tcp-evidence-and-cli-state
          fi
