name: Go CI

on:
  push:
    branches:
      - main
      - feat/unified-service-model
      - phase8-usability-foundation
      - phase8-temporal-investigation-export
      - phase8-unified-discovery-report
      - phase8-researcher-narrative
      - phase8-intelligence-gap-detection
      - phase8-adaptive-investigation-workflow
      - phase9-malformed-fuzz-race-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run controlled loopback validation lab
        run: python3 scripts/validation-lab/run.py --output-dir "$RUNNER_TEMP/kem3t-validation-lab"

      - name: Check all tracked Go files are formatted
        run: |
          unformatted=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            while IFS= read -r file; do
              printf '\nFormatting diff for %s:\n' "$file"
              gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -p 1 -count=1 ./...

      - name: Run fuzz smoke test
        run: go test -run="^$" -fuzz=FuzzCoreInputValidation -fuzztime=3s ./internal/integration

      - name: Run performance benchmarks (single sample)
        run: go test -run '^$' -bench 'Benchmark(BuildDNS|MarshalDNS|SQLite)' -benchtime=1x -benchmem ./internal/batch ./internal/evidence

      - name: Verify module graph and checksums
        run: |
          go mod tidy -diff
          go mod verify

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Verify reproducible CLI build
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/kem3t-first" ./cmd/kem3t
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/kem3t-second" ./cmd/kem3t
          cmp "$RUNNER_TEMP/kem3t-first" "$RUNNER_TEMP/kem3t-second"
      - name: Run go vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Cross-compile release targets
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
            env GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/kem3t-$GOOS-$GOARCH$suffix" ./cmd/kem3t
          done
