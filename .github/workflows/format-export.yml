name: Format Export
on:
  push:
    branches:
      - feat/unified-intelligence-backbone
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          changed=$(git diff --name-only origin/main...HEAD -- '*.go')
          printf '%s\n' "$changed" | xargs -r gofmt -w
      - name: Upload formatted Go files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-go
          path: |
            internal/collectors/tcp_test.go
            internal/intelligence/engine.go
            internal/investigation/collector_stage.go
            internal/investigation/engine.go
            internal/observations/collection.go
            internal/observations/observation.go
            internal/observations/service.go
            internal/pipeline/tcp.go
