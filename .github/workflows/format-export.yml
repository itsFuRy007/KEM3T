name: Format Export
on:
  push:
    branches:
      - feat/unified-intelligence-backbone
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          changed=$(git diff --name-only origin/main...HEAD -- '*.go')
          printf '%s\n' "$changed" | xargs -r gofmt -w
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.go'
          git commit -m "chore: gofmt changed Go files"
          git push origin HEAD:feat/unified-intelligence-backbone
