name: Format audit branch

on:
  push:
    branches:
      - audit/reliability-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format changed Go files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.go')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files."
            exit 0
          fi
          gofmt -w "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "Changed Go files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Format changed Go files"
          git push origin HEAD:audit/reliability-hardening
